name: Bake prices

on:
  schedule:
    - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bake TCGCSV market prices
        run: node bake-prices.mjs
      - name: Commit prices.js if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.js
          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi
          git commit -m "Bake TCGCSV market prices"
          git push
